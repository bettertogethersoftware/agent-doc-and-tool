interface:
  display_name: "Agent Docs & Tools"
  short_description: "Find approved local docs, tools, prompts, secrets"
  default_prompt: "Use $agent-doc-and-tool to route explicit agent-doc, agent-tool, and agent-prompt requests through list_tool and list_prompt first; use list when document scope is unknown, but search exact sibling documentation aliases from list_tool directly; inspect approved documentation and configured tool paths, confirm prompt selection before action, and return the versioned agent-dry-run-plan contract with execution.performed false before any authorized execution."

dependencies:
  tools:
    - type: "mcp"
      value: "local_doc_search"
      description: "Read-only local documentation, tool, reusable-prompt, and exact secret-file MCP server"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
