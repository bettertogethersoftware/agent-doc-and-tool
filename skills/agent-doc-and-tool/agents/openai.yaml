interface:
  display_name: "Agent Docs & Tools"
  short_description: "Find approved local docs, tools, prompts, secrets"
  default_prompt: "Use $agent-doc-and-tool to route explicit agent-doc, agent-tool, and agent-prompt requests through list, list_tool, and list_prompt first; inspect approved documentation and configured tool paths, confirm prompt selection before action, and safely access exact grants."

dependencies:
  tools:
    - type: "mcp"
      value: "local_doc_search"
      description: "Read-only local documentation, tool, reusable-prompt, and exact secret-file MCP server"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
