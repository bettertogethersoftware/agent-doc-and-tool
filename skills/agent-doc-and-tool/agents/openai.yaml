interface:
  display_name: "Agent Docs & Tools"
  short_description: "Find approved local docs, tools, prompts, secrets"
  default_prompt: "Use $agent-doc-and-tool to find authoritative local instructions, resolve allowlisted tools, retrieve a reusable prompt, or access an exact secret grant safely."

dependencies:
  tools:
    - type: "mcp"
      value: "local_doc_search"
      description: "Read-only local documentation, tool, reusable-prompt, and exact secret-file MCP server"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
