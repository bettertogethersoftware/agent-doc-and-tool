interface:
  display_name: "Local Docs and Tools"
  short_description: "Find trusted local docs and tool paths"
  default_prompt: "Use $local-doc-search to find authoritative local instructions and resolve allowlisted tool paths before using an unfamiliar local tool."

dependencies:
  tools:
    - type: "mcp"
      value: "local_doc_search"
      description: "Read-only local documentation search, fetch, and tool discovery MCP server"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
